name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.2.
        required: true
        type: string
      target_ref:
        description: Branch, tag, or commit on main to release.
        required: true
        default: main
        type: string
      release_notes:
        description: Optional release notes. Leave empty to use GitHub generated release notes.
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'cutehackers/vault-graph'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Validate release version
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          import tomllib
          from pathlib import Path

          requested = os.environ["RELEASE_VERSION"]
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", requested) is None:
              raise SystemExit(f"version {requested!r} must be X.Y.Z without a v prefix")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = pyproject["project"]["version"]
          init_text = Path("src/vault_graph/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)

          if match is None:
              raise SystemExit("src/vault_graph/__init__.py does not expose __version__")
          if package_version != requested:
              raise SystemExit(f"pyproject version {package_version} does not match requested {requested}")
          if match.group(1) != requested:
              raise SystemExit(f"package __version__ {match.group(1)} does not match requested {requested}")
          PY
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Confirm release tag is unused on the remote
        run: |
          tag="v${RELEASE_VERSION}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "Tag ${tag} already exists."
            exit 1
          fi
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Confirm target commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Target commit $(git rev-parse HEAD) is not on origin/main."
            exit 1
          fi
      - name: Lint
        run: uv run --python 3.12 ruff check src tests packages
      - name: Type check
        run: uv run --python 3.12 mypy src tests packages/text-embeddings/src packages/vector-search/src packages/vector-index/src
      - name: Test
        run: uv run --python 3.12 --all-packages --all-extras pytest -q tests packages/*/tests
      - name: Verify independently installed module wheels and Vault integration
        run: uv run --python 3.12 python tests/verify_graph_module_wheels.py
      - name: Build distributions
        run: |
          rm -rf dist
          uv build
      - name: Verify release distributions
        run: uv run --python 3.12 python tests/verify_release_dist.py dist
      - name: Write manual release notes
        if: ${{ inputs.release_notes != '' }}
        run: |
          printf '%s\n' "${RELEASE_NOTES}" > release-notes.md
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
      - name: Create tag and GitHub Release with manual notes
        if: ${{ inputs.release_notes != '' }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --title "v${RELEASE_VERSION}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Create tag and GitHub Release with generated notes
        if: ${{ inputs.release_notes == '' }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --generate-notes \
            --target "$(git rev-parse HEAD)" \
            --title "v${RELEASE_VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
