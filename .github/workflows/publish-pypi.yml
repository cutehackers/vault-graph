name: publish-pypi

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cutehackers/vault-graph'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uv run --python 3.12 ruff check src tests packages
      - name: Type check
        run: uv run --python 3.12 mypy src tests packages/text-embeddings/src packages/vector-search/src packages/vector-index/src
      - name: Test
        run: uv run --python 3.12 --all-packages --all-extras pytest -q tests packages/*/tests
      - name: Verify independently installed module wheels and Vault integration
        run: uv run --python 3.12 python tests/verify_graph_module_wheels.py
      - name: Build distributions
        run: uv build --all-packages
      - name: Check distributions
        run: uv run --python 3.12 --with twine python -m twine check dist/*
      - name: Publish independent modules to PyPI
        run: >-
          uv publish --check-url https://pypi.org/simple/ --trusted-publishing always
          dist/nolemy_*
      - name: Publish Vault Graph to PyPI
        run: >-
          uv publish --check-url https://pypi.org/simple/ --trusted-publishing always
          dist/vault_graph-*
