name: publish-testpypi

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-testpypi
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cutehackers/vault-graph'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uv run --python 3.12 ruff check src tests packages
      - name: Type check
        run: uv run --python 3.12 mypy src tests packages/text-embeddings/src packages/vector-search/src packages/vector-index/src
      - name: Test
        run: uv run --python 3.12 --all-packages --all-extras pytest -q tests packages/*/tests
      - name: Verify independently installed module wheels and Vault integration
        run: uv run --python 3.12 python tests/verify_graph_module_wheels.py
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uv run --python 3.12 --with twine python -m twine check dist/*
      - name: Verify release distributions
        run: uv run --python 3.12 python tests/verify_release_dist.py dist
      - name: Publish Vault Graph to TestPyPI
        run: >-
          uv publish --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/ --trusted-publishing always
          dist/vault_graph-*
