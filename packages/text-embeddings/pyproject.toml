[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nolemy-text-embeddings"
version = "0.1.0"
description = "Reusable text embedding contracts and optional FastEmbed provider"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
fastembed = ["fastembed>=0.8,<1"]
dev = ["pytest>=8", "mypy>=1.13", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/text_embeddings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true
