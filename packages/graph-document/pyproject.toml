[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nolemy-graph-document"
version = "0.1.0"
description = "Rebuildable document contribution graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
search = ["nolemy-graph-search>=0.1,<1"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "nolemy-graph-search>=0.1,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_document"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "graph_search.*"
ignore_missing_imports = true
